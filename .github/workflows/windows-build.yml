name: Windows native build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-x64
      - name: Build Debug
        shell: pwsh
        run: cmake --build build/windows-msvc-x64 --config Debug
      - name: Build Release
        shell: pwsh
        run: cmake --build build/windows-msvc-x64 --config Release
      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/windows-msvc-x64 -C Debug --output-on-failure
      - name: Verify service executable
        shell: pwsh
        run: |
          $exe = "build/windows-msvc-x64/apps/service/Release/PSeriesService.exe"
          if (-not (Test-Path $exe)) {
            $exe = "build/windows-msvc-x64/apps/service/Debug/PSeriesService.exe"
          }
          if (-not (Test-Path $exe)) { throw "PSeriesService.exe was not produced" }
          if (-not ((Get-Item $exe).Length -gt 0)) { throw "PSeriesService.exe is empty" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' |
            Select-Object -First 1
          if (-not $dumpbin -or -not (Test-Path $dumpbin)) { throw "dumpbin.exe unavailable" }
          $pe = & $dumpbin /headers $exe
          if ($pe -notmatch "machine \(x64\)") { throw "PSeriesService.exe is not x64" }
      - name: Install WiX 6.0.1
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.1
      - name: Build MSI
        shell: pwsh
        run: |
          cmake --build build/windows-msvc-x64 --config Release --target PSeriesNativeMSI
          $msi = Get-ChildItem -Path build/windows-msvc-x64 -Filter *.msi -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msi) { throw "PSeriesNative MSI was not produced" }
          "PSeriesMSI=$($msi.FullName)" >> $env:GITHUB_ENV
      - name: Verify MSI
        shell: pwsh
        run: |
          if (-not $env:PSeriesMSI) { throw "PSeriesMSI environment value missing" }
          $bytes = (Get-Item $env:PSeriesMSI).Length
          if ($bytes -le 0) { throw "MSI is empty" }
      - name: Prepare downloadable build
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "build\release-artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $exe = "build/windows-msvc-x64/apps/service/Release/PSeriesService.exe"
          if (-not (Test-Path $exe)) { throw "Release service executable not found: $exe" }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $artifactDir "PSeriesService.exe")
          $msiDestination = Join-Path $artifactDir "PSeriesNative-x64.msi"
          Copy-Item -LiteralPath $env:PSeriesMSI -Destination $msiDestination
          $hash = (Get-FileHash -LiteralPath $msiDestination -Algorithm SHA256).Hash
          "$hash  PSeriesNative-x64.msi" | Set-Content -Path (Join-Path $artifactDir "SHA256SUMS.txt")
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PSeriesNative-windows-x64
          path: build/release-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Run MSI lifecycle integration test
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File tests/integration/Test-MsiLifecycle.ps1 -MsiPath "$env:PSeriesMSI"
